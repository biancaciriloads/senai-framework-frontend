<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Adivinhação</title>
    <!-- Vincula o arquivo CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">
        <h1>Adivinhe o Número</h1>
        <p>Tente adivinhar o número secreto entre <strong>1 e 100</strong>!</p>

        <div class="input-group">
            <input type="number" id="guessInput" min="1" max="100" placeholder="Seu palpite...">
            <button id="guessButton">Chutar</button>
        </div>

        <div class="message" id="message"></div>
        <p id="attemptsText">Tentativas: 0</p>

        <button class="restart-btn" id="restartButton">Jogar Novamente</button>
    </div>

    <!-- Vincula o arquivo JavaScript externo -->
    <script src="script.js"></script>
</body>

</html>
